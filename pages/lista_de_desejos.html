<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Terra de Uns- Lista de Desejos</title>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="/Jacooobs/assets/css/style.css">
    </head>

    <body>
        <div class="container">
            <h1>Lista de Desejos</h1>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Gênero</th>
                        <th>Categoria</th>
                        <th>Autor</th>
                        <th>Data de Publicação</th>
                        <th>Preço</th>
                        <th>Número de Série</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${Books.isEmpty()}">
                        <td colspan="8" class="empty">Nenhum produto encontrado</td>
                    </tr>

                    <tr th:each = "Book : ${Books}">
                        <td th:text="${Book.id}"></td>
                        <td th:text="${Book.nome}"></td>
                        <td th:text="${Book.genero}"></td>
                        <td th:text="${Book.categoria}"></td>
                        <td th:text="${Book.autor}"></td>
                        <td th:text="${Book.data}"></td>
                        <td th:text="${Book.preco}"></td>
                        <td th:text="${Book.num_serie}"></td>
                    </tr>
                </tbody>
            </table>

            <a href="/Jacooobs" class="btn">Voltar para a página inicial</a>
        </div>
    </body>
</html>
